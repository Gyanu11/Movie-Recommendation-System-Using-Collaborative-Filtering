{#
    Displays a read-only movie rating using stars.
    It supports ratings from 0–5, including half-stars and can show an optional tooltip.
#}

<span class="inline-flex items-center gap-0.5 align-middle" {% if label %}title="{{ label }}"{% endif %}>
  {% for position in range(1, 6) %}
    {% set fill = star_fill(value, position) %}
    <svg class="h-4 w-4 {% if fill == 'empty' %}text-zinc-600{% else %}text-amber-400{% endif %}" viewBox="0 0 20 20" aria-hidden="true">
      <path fill="{% if fill == 'half' %}url(#halfStarFill){% else %}currentColor{% endif %}"
            d="M10 1.5l2.6 5.3 5.9.85-4.25 4.15 1 5.85L10 14.9l-5.25 2.75 1-5.85L1.5 7.65l5.9-.85L10 1.5z"/>
    </svg>
  {% endfor %}
</span>
